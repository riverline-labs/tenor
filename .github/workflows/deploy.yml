name: Deploy Tenor Serve

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: us-central1
  PROJECT_ID: tenor-platform
  REGISTRY: us-central1-docker.pkg.dev/tenor-platform/tenor
  SERVICE: tenor-serve

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/295642594837/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@tenor-platform.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          IMAGE="${{ env.REGISTRY }}/tenor-serve"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --image=${{ env.REGISTRY }}/tenor-serve:${{ github.sha }}
